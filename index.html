<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer-to-peer | Обменник</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Верхняя плашка с названием -->
        <header class="main-header">
            <div class="logo-container">
                <i class="fab fa-telegram logo-icon"></i>
                <h1 class="app-title">Peer-to-peer</h1>
                <div class="premium-badge">
                    <i class="fas fa-crown"></i>
                    <span>PRO</span>
                </div>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Приветствие -->
            <div class="welcome-section">
                <div class="welcome-text">
                    <h2>Добро пожаловать!</h2>
                    <p>Начни обмен прямо сейчас! Полная навигация и личный кабинет</p>
                </div>
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>

            <!-- Кнопки навигации -->
            <div class="nav-buttons">
                <button class="nav-btn exchange-btn" id="exchangeBtn">
                    <div class="btn-icon">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    <div class="btn-content">
                        <h3>Обменник</h3>
                        <p>Мгновенный обмен криптоактивов</p>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </button>

                <button class="nav-btn navigation-btn" id="navigationBtn">
                    <div class="btn-icon">
                        <i class="fas fa-map-marked-alt"></i>
                    </div>
                    <div class="btn-content">
                        <h3>Навигация</h3>
                        <p>По проектам Peer-to-peer</p>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </button>

                <button class="nav-btn account-btn" id="accountBtn">
                    <div class="btn-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <div class="btn-content">
                        <h3>Личный кабинет</h3>
                        <p>Журнал сделок и аналитика</p>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </button>

                <button class="nav-btn premium-btn" id="premiumBtn">
                    <div class="btn-icon">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="btn-content">
                        <h3>Premium</h3>
                        <p>Дополнительные функции и услуги</p>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </button>

                <button class="nav-btn support-btn" id="supportBtn">
                    <div class="btn-icon">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div class="btn-content">
                        <h3>Поддержка</h3>
                        <p>Помощь и обратная связь</p>
                    </div>
                    <div class="btn-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </button>
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
