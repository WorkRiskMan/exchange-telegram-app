<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обменник</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Обменник</h1>
        </header>
        
        <main class="app-main">
            <div class="exchange-options">
                <button class="exchange-btn buy-btn" id="buyBtn">
                    <span class="btn-text">Купить</span>
                    <span class="btn-icon">🛒</span>
                </button>
                
                <button class="exchange-btn sell-btn" id="sellBtn">
                    <span class="btn-text">Продать</span>
                    <span class="btn-icon">💰</span>
                </button>
            </div>
            
            <div class="exchange-form" id="exchangeForm">
                <div class="form-header">
                    <h2 id="formTitle">Купить</h2>
                    <button class="close-btn" id="closeFormBtn">✕</button>
                </div>
                
                <div class="form-content">
                    <div class="input-group">
                        <label for="amount">Сумма (USD)</label>
                        <input type="number" id="amount" placeholder="Введите сумму" min="1" max="10000">
                    </div>
                    
                    <div class="input-group">
                        <label for="currency">Валюта получения</label>
                        <select id="currency">
                            <option value="RUB">Рубли (RUB)</option>
                            <option value="EUR">Евро (EUR)</option>
                            <option value="KZT">Тенге (KZT)</option>
                            <option value="BYN">Белорусские рубли (BYN)</option>
                        </select>
                    </div>
                    
                    <div class="rate-info">
                        <p>Курс: <span id="currentRate">1 USD = 90.5 RUB</span></p>
                        <p>Вы получите: <span id="receiveAmount" class="result-amount">0</span></p>
                    </div>
                    
                    <button class="submit-btn" id="submitBtn">Подтвердить</button>
                </div>
            </div>
            
            <div class="notification" id="notification">
                <p id="notificationText"></p>
            </div>
        </main>
        
        <footer class="app-footer">
            <p>Курсы обновляются ежедневно</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
